[package]
name = "vp-core"
version = "0.1.0"
edition = "2021"
description = "Tauri-independent library logic: folders, scanning, tags, playlists, settings, mpv IPC client"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Pipes"] }

[dev-dependencies]
tempfile = "3"
